<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found — Samuel Akinwumi</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b0d10">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ffbd39'/%3E%3Cstop offset='1' stop-color='%23ff8c42'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='41' font-family='Sora,Poppins,Arial,sans-serif' font-size='26' font-weight='700' text-anchor='middle' fill='%231a1200'%3ESA%3C/text%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Sora:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/site.css">
  <script>document.documentElement.classList.add("js");</script>

  <style>
    .error { position: relative; min-height: 100svh; display: flex; align-items: center; text-align: center; overflow: hidden; padding: calc(var(--header-h) + 40px) 0 80px; }
    .error__big {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -55%);
      font-family: var(--font-display); font-size: 34vw; font-weight: 800; line-height: 1; margin: 0;
      color: transparent; -webkit-text-stroke: 1px rgba(255, 255, 255, 0.06); pointer-events: none; user-select: none;
    }
    .error .container { position: relative; max-width: 760px; }
    .error h1 { font-size: clamp(2rem, 5vw, 3.4rem); font-weight: 800; letter-spacing: -0.02em; margin: 10px 0 14px; }
    .error h1 .accent { color: var(--accent); }
    .error__lead { color: var(--muted); font-size: 1.08rem; margin-bottom: 28px; }
    .terminal {
      max-width: 560px; margin: 0 auto 36px; text-align: left; border-radius: var(--radius-sm); overflow: hidden;
      background: var(--surface); border: 1px solid var(--border-strong); box-shadow: 0 30px 60px -30px rgba(0, 0, 0, 0.9);
      font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.85rem;
    }
    .terminal__bar { display: flex; gap: 6px; padding: 10px 14px; border-bottom: 1px solid var(--border); }
    .terminal__bar i { width: 11px; height: 11px; border-radius: 50%; }
    .terminal__body { padding: 18px 20px; line-height: 1.9; color: var(--text-2); }
    .terminal__body div { opacity: 0; animation: rise 0.5s var(--ease) both; }
    .terminal__body div:nth-child(1) { animation-delay: 300ms; }
    .terminal__body div:nth-child(2) { animation-delay: 700ms; }
    .terminal__body div:nth-child(3) { animation-delay: 1100ms; }
    .terminal__body div:nth-child(4) { animation-delay: 1500ms; }
    .p { color: var(--accent); } .r { color: #ff6b6b; } .g { color: var(--green); } .c { color: var(--muted); }
    .cursor { display: inline-block; width: 9px; height: 1.1em; background: var(--accent); vertical-align: -3px; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .error__actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; }
    @media (prefers-reduced-motion: reduce) { .terminal__body div { opacity: 1; } }
  </style>
</head>
<body>

<header class="header is-scrolled">
  <div class="container">
    <a class="brand" href="/" aria-label="Samuel Akinwumi, home">
      <span class="brand__mark" aria-hidden="true">SA</span>
      <span class="brand__name">Samuel Akinwumi</span>
    </a>
    <a class="btn btn--ghost" href="/#contact" style="padding:10px 18px;font-size:.85rem">Contact</a>
  </div>
</header>

<main class="error">
  <div class="hero__blob hero__blob--a" aria-hidden="true"></div>
  <div class="hero__blob hero__blob--b" aria-hidden="true"></div>
  <p class="error__big" aria-hidden="true">404</p>

  <div class="container">
    <p class="eyebrow" style="justify-content:center">Error 404</p>
    <h1>This page is <span class="accent">not in the cloud</span></h1>
    <p class="error__lead">The page you're looking for doesn't exist, was moved, or never got deployed.</p>

    <div class="terminal" aria-hidden="true">
      <div class="terminal__bar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>
      <div class="terminal__body">
        <div><span class="p">$</span> curl -I https://akinwumisamuel.com<span id="error-path"></span></div>
        <div><span class="r">HTTP/2 404</span> <span class="c"># NoSuchKey</span></div>
        <div><span class="p">$</span> cd ~ <span class="c"># let's get you home</span></div>
        <div><span class="g">&#10004; redirect ready</span> <span class="cursor"></span></div>
      </div>
    </div>

    <div class="error__actions">
      <a class="btn btn--primary" href="/">Back to home
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>
      <a class="btn btn--ghost" href="/#contact">Contact me</a>
    </div>
  </div>
</main>

<script>
  document.getElementById("error-path").textContent = window.location.pathname;
</script>
</body>
</html>
