<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Page Not Found - Samuel Akinwumi</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="robots" content="noindex">

    <link href="https://fonts.googleapis.com/css?family=Poppins:100,200,300,400,500,600,700,800,900" rel="stylesheet">

    <link rel="stylesheet" href="css/open-iconic-bootstrap.min.css">
    <link rel="stylesheet" href="css/icomoon.css">
    <link rel="stylesheet" href="css/style.css">

    <style>
      .error-wrap {
        min-height: 100vh;
        display: flex;
        align-items: center;
        position: relative;
        overflow: hidden;
        padding: 140px 0 80px;
      }
      .error-wrap .big {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -55%);
        font-size: 32vw;
        font-weight: 900;
        line-height: 1;
        margin: 0;
        color: rgba(255, 255, 255, 0.04);
        pointer-events: none;
        user-select: none;
      }
      .error-code {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 4px;
        text-transform: uppercase;
        color: #ffbd39;
      }
      .error-wrap h1 {
        font-size: 56px;
        font-weight: 800;
        color: #fff;
      }
      .error-wrap h1 span {
        color: #ffbd39;
      }
      .error-wrap p.lead {
        color: rgba(255, 255, 255, 0.7);
        font-size: 18px;
      }
      .error-terminal {
        max-width: 560px;
        margin: 30px auto 40px;
        text-align: left;
        background: #232931;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        font-family: Menlo, Consolas, "Courier New", monospace;
        font-size: 14px;
        overflow: hidden;
      }
      .error-terminal .bar {
        padding: 10px 14px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      .error-terminal .bar i {
        display: inline-block;
        width: 11px;
        height: 11px;
        border-radius: 50%;
        margin-right: 6px;
      }
      .error-terminal .body {
        padding: 18px 20px;
        line-height: 1.9;
        color: rgba(255, 255, 255, 0.8);
      }
      .error-terminal .p { color: #ffbd39; }
      .error-terminal .r { color: #ff6b6b; }
      .error-terminal .g { color: #a0f669; }
      .error-terminal .c { color: rgba(255, 255, 255, 0.4); }
      .error-terminal .cursor {
        display: inline-block;
        width: 9px;
        height: 17px;
        background: #ffbd39;
        vertical-align: -3px;
        animation: blink 1s steps(1) infinite;
      }
      @keyframes blink { 50% { opacity: 0; } }
      @media (max-width: 767px) {
        .error-wrap h1 { font-size: 36px; }
        .error-terminal { font-size: 12px; }
      }
    </style>
  </head>
  <body>

    <nav class="navbar navbar-expand-lg navbar-dark ftco_navbar ftco-navbar-light site-navbar-target" id="ftco-navbar">
      <div class="container">
        <a class="navbar-brand" href="index.html">&am</a>
      </div>
    </nav>

    <section class="error-wrap">
      <h2 class="big">404</h2>
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-md-10 text-center">
            <div class="error-code">Error 404</div>
            <h1 class="mb-3 mt-2">This page is <span>not in the cloud</span></h1>
            <p class="lead">The page you're looking for doesn't exist, was moved, or never got deployed.</p>

            <div class="error-terminal">
              <div class="bar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>
              <div class="body">
                <div><span class="p">$</span> curl -I https://akinwumisamuel.com<span id="error-path"></span></div>
                <div><span class="r">HTTP/2 404</span> <span class="c"># NoSuchKey</span></div>
                <div><span class="p">$</span> cd ~ <span class="c"># let's get you home</span></div>
                <div><span class="g">&#10004; redirect ready</span> <span class="cursor"></span></div>
              </div>
            </div>

            <p>
              <a href="index.html" class="btn btn-primary py-3 px-4 mr-2 mb-2">Back to Home</a>
              <a href="index.html#contact-section" class="btn btn-white btn-outline-white py-3 px-4 mb-2">Contact Me</a>
            </p>
          </div>
        </div>
      </div>
    </section>

    <script>
      // Show the path that was requested in the fake terminal
      document.getElementById('error-path').textContent = window.location.pathname;
    </script>

  </body>
</html>
