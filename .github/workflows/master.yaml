name: 'Deploy static site to s3'
description: 'deploy and test only cloudformation stacks on PR. Push mysite directly to s3 otherwise'
on:
    pull_request:
        types: [opened, synchronize, closed]
    push:
        branches:
            - master
permissions:
    contents: read
    pull-requests: write
    security-events: write
    models: read
    id-token: write #required for Github OIDC

jobs:         
    deploy-stack:
        #force stack deployment only when PR is closed
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: 'arn:aws:iam::045283898962:role/GithubIdentityProviderRole'
                  aws-region: 'us-east-1'

            - name: Security Scan with AI SSDLC security suite
              uses: subzone/ssdlc-action@v1.3.0
              with:
                  github-token: ${{ github.token }}
                  ai-provider: github
                  severity-threshold: medium
                  enable-iac-scan: true 
                  enable-sast: true
                  enable-sca: false
                  fail-on-findings: false
                  enable-secret-scan: true
                  enable-ai-triage: true
                  enable-ai-fix-suggestions: true
                  sarif-upload: true

            - name: Set up node
              uses: actions/setup-node@v4
              with: 
                node-version: '22.x'
            
            - name: Validate CDK 
              run: |
                npm install -g aws-cdk
                npm install
                cdk synth CdkMyPortfolioSiteStack

            - name: Deploy Stack
              run: |
                  cdk deploy CdkMyPortfolioSiteStack --require-approval never

            - name: Comment on PR
              uses: actions/github-script@v6
              with:
                  script: |
                    github.rest.issues.createComment({
                    issue_number: context.issue.number,
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    body: 'CDK stack good to go, you can merge!'
                    })


    deploy-site:
        #allow site deployment only on master
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        runs-on: 'ubuntu-latest'
        steps: 
            - name: Checkout
              uses: actions/checkout@v2

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: 'arn:aws:iam::045283898962:role/GithubIdentityProviderRole'
                  aws-region: 'us-east-1'
            
            - name: Check s3 bucket exists
              run: |
                aws s3 ls akinwumisamuel.com

            - name: Deploy site to S3
              run: |
                aws s3 sync ./mysite/ s3://akinwumisamuel.com --delete \
                --exclude "*" \
                --include "*.html" --include "css/*" --include "js/*" --include "fonts/*" \
                --include "images/*" --include "*.pdf" \
                --exclude "*.scss" --exclude "*.original.html"  --exclude "*.docx" \
                --exclude "fonts/flaticon/backup.txt" --exclude "fonts/flaticon/font/flaticon.html"

    